# Publish package

name: Test and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    environment: package
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: filter changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            project:
              - 'waifuVault-csharp-api.csproj'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Test
        run: dotnet test tests
      - name: Build
        run: dotnet pack
      - name: Nuget login
        uses: NuGet/login@v1
          id: login
          with:
            user: ${{ secrets.NUGET_USER }}
      - name: Publish
        if: steps.changes.outputs.project == 'true'
        run: dotnet nuget push bin/Release/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
